<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidLib - Biblioteca Vazia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0d0d12',
                        surface: '#15151c',
                        surfaceBorder: '#272732',
                        primary: '#8b5cf6',
                        primaryHover: '#7c3aed',
                        textMuted: '#9ca3af'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-background text-white min-h-screen flex flex-col relative">

    <!-- Header -->
    <header class="border-b border-surfaceBorder bg-background px-8 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2 text-xl font-bold">
            <div class="w-8 h-8 bg-primary rounded flex items-center justify-center">
                <i class="fa-solid fa-play text-white text-sm"></i>
            </div>
            VidLib
        </div>
        <div class="flex bg-surface rounded-md border border-surfaceBorder p-1">
            <a href="{{ url_for('homepage') }}" data-route="/" class="nav-link flex items-center gap-2 px-4 py-2 rounded text-sm font-medium transition-colors text-textMuted hover:text-white">
                <i class="fa-solid fa-layer-group"></i> Biblioteca
            </a>
            <a href="{{ url_for('estatisticas')}}" data-route="/estatisticas" class="nav-link flex items-center gap-2 px-4 py-2 rounded text-sm font-medium transition-colors text-textMuted hover:text-white">
                <i class="fa-solid fa-chart-simple"></i> Estatísticas
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-8 flex flex-col">
        <!-- Search Bar -->
        <form action="{{ url_for('search') }}" method="get" class="relative w-full mb-20">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-textMuted"></i>
            <input name="q" type="text" placeholder="Buscar por título ou autor..." value="{{ request.args.get('q', '') }}" class="w-full bg-surface border border-surfaceBorder rounded-lg py-3 pl-10 pr-4 text-sm focus:outline-none focus:border-primary transition-colors text-white placeholder-textMuted">
        </form>

        <!-- Empty State -->
        <div class="flex-1 flex flex-col items-center justify-center text-center">
            <div class="text-textMuted text-5xl mb-4 opacity-50">
                <i class="fa-regular fa-folder-open"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Biblioteca vazia</h2>
            <p class="text-textMuted mb-6 max-w-sm">Adicione seu primeiro vídeo e comece a construir sua coleção compartilhada.</p>
            <a href="{{ url_for('videonovo') }}" class="bg-primary hover:bg-primaryHover text-white px-6 py-3 rounded-lg font-medium flex items-center gap-2 transition-colors shadow-[0_0_15px_rgba(139,92,246,0.3)]">
                <i class="fa-solid fa-plus"></i> Adicionar primeiro vídeo
            </a>
        </div>
    </main>

    <!-- FAB -->
    <button class="fixed bottom-8 right-8 w-14 h-14 bg-primary hover:bg-primaryHover rounded-full flex items-center justify-center text-white text-xl shadow-[0_0_20px_rgba(139,92,246,0.4)] transition-transform hover:scale-105">
        <i class="fa-solid fa-plus"></i>
    </button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('.nav-link');
            const currentPath = window.location.pathname;

            links.forEach(link => {
                const route = link.getAttribute('data-route');
                if (route === currentPath) {
                    link.classList.add('bg-surfaceBorder', 'text-white');
                    link.classList.remove('text-textMuted');
                } else {
                    link.classList.remove('bg-surfaceBorder', 'text-white');
                    link.classList.add('text-textMuted');
                }
            });
        });
    </script>

</body>
</html>
